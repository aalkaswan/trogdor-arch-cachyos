# Qualcomm SC7180 (Adreno 618 + Venus V4L2 M2M) Wayland configuration

# Wayland GPU rendering (Adreno 618 Freedreno)
vo=gpu-next
gpu-context=wayland
profile=fast

# Hardware video decode via Qualcomm Venus (/dev/video1)
# Supports H.264, HEVC, VP8, VP9, MPEG2 (no AV1 hardware decoder on SC7180)
hwdec=v4l2m2m-copy
hwdec-codecs=h264,hevc,vp8,vp9,mpeg2video

# YouTube / yt-dlp: prefer <=1080p VP9/H.264 (skip AV1 so Venus HW decode is used)
ytdl-format=bestvideo[height<=1080][vcodec!^=av01]+bestaudio/best[height<=1080]

# Memory-friendly buffering for 3.8 GiB RAM
cache=yes
demuxer-max-bytes=64MiB
demuxer-max-back-bytes=16MiB

# Clean audio via PipeWire
ao=pipewire
save-position-on-quit=yes
