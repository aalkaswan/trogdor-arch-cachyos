[ids]
# Acer Chromebook Spin 513 (Google Lazor) internal keyboard ONLY
# (excludes cros_ec_buttons 0000:0000:c68a2d8e so tablet-mode switch stays untouched)
0000:0000:af5c732c

[main]
# ChromeOS top-row action keys
f1 = back
f2 = forward
f3 = refresh
f4 = f11
f5 = scale
f6 = brightnessdown
f7 = brightnessup
f8 = mute
f9 = volumedown
f10 = volumeup

# Search key (Caps Lock position): tap = Super, hold = ChromeOS function layer
leftmeta = layer(meta)

[meta]
# Hold Search + top row for real F1-F10
f1 = f1
f2 = f2
f3 = f3
f4 = f4
f5 = f5
f6 = f6
f7 = f7
f8 = f8
f9 = f9
f10 = f10

# ChromeOS Search navigation shortcuts
backspace = delete
left = home
right = end
up = pageup
down = pagedown

[alt]
# ChromeOS Alt+Search = Caps Lock, Alt+Brightness = Keyboard Backlight
leftmeta = capslock
f6 = kbdillumdown
f7 = kbdillumup

[control]
# ChromeOS Ctrl+Overview = Screenshot (Print)
f5 = print
